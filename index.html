<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friendly Pairs</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <h1>Friendly Pairs</h1>

        <nav>
            <a href="#game">Play</a>
            <a href="#instructions">How To Play</a>
            <a href="#about">About</a>
        </nav>
    </header>

        <main>

        <section id="game">
            <h2>Choose Your Game</h2>

        <div class="controls">

            <label>
                Theme:
        <select id="theme">
           <option value="animals">Animals</option>
           <option value="numbers">Numbers</option>
           <option value="colours">Colours</option>
        </select>
            </label>

            <label>
                Difficulty:
        <select id="difficulty">
           <option value="8">Easy - 8 Cards</option>
           <option value="12">Medium - 12 Cards</option>
           <option value="16">Hard - 16 Cards</option>
        </select>
            </label>
        </div>

        <button id="start" type="button">Start Game</button>

        <p>
         Moves:
        <span id="moves" aria-live="polite">0</span>
        </p>

        <p id="message" aria-live="polite">Choose your game settings</p>

       <div
           id="board"
           role="group"
           aria-label="Memory game cards">
       </div>

    </section>

        <section id="instructions">

            <h2>How To Play</h2>

            <p>Find matching pairs by selecting two cards</p>

        </section>

        <section id="about">

            <h2>About Friendly Pairs</h2>

            <p>An accessible memory game designed for children and SEND learners</p>

        </section>

        </main>

        <script src="js/script.js"></script>
        
</body>

</html>
